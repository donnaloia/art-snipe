[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artpipe"
version = "0.1.0"
description = "AI-driven 2D game asset pipeline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
artpipe = "artpipe.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["artpipe*"]
