services:
  artpipe-cli:
    build:
      context: ./asset_pipeline
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./:/repo
      - ./workspace:/repo/workspace
      - ./mockups:/repo/mockups
      - ./godot_project/assets:/repo/godot_project/assets
    environment:
      - ARTPipe_REPO=/repo
      - COMFYUI_URL=http://comfyui:8188
      - SAM_URL=http://sam:8001
      - REMBG_URL=http://rembg:7000

  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest
    ports:
      - "8188:8188"
    volumes:
      - ./models:/models
      - ./workspace:/workspace
    profiles: ["gpu"]

  sam:
    build:
      context: ./services/sam
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models
      - ./workspace:/workspace

  rembg:
    image: danielgatis/rembg:latest
    command: ["s", "--host", "0.0.0.0", "--port", "7000"]
    ports:
      - "7000:7000"

  review-ui:
    build:
      context: ./services/review-ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./workspace:/app/workspace
      - ./godot_project/assets:/app/godot_assets
