# All Art Snipe configuration lives in this file. Fill in the two API keys
# below before your first `make up`. To keep your keys out of git after
# editing, run once:
#
#   git update-index --skip-worktree docker-compose.yml
#
# (To resume tracking changes later: `git update-index --no-skip-worktree docker-compose.yml`.)

services:
  artpipe-cli:
    build:
      context: ./asset_pipeline
      dockerfile: Dockerfile
    working_dir: /repo
    volumes:
      - ./:/repo
      - ./workspace:/repo/workspace
      - ./mockups:/repo/mockups
      - ./game_assets:/repo/game_assets
    environment:
      # ─── Required ─────────────────────────────────────────────────────────
      # Free tier: https://aistudio.google.com/apikey
      GEMINI_API_KEY: ""
      # Paid: https://platform.openai.com/api-keys (~$0.04/image at medium quality)
      OPENAI_API_KEY: ""

      # ─── Optional overrides ───────────────────────────────────────────────
      ARTPIPE_VISION_PROVIDER: gemini
      ARTPIPE_IMAGE_GEN_PROVIDER: openai
      ARTPIPE_IMAGE_QUALITY: medium      # low | medium | high
      ARTPIPE_PROJECT_NAME: my-game
      # ARTPIPE_GEMINI_MODEL: gemini-2.5-flash
      # ARTPIPE_OPENAI_IMAGE_MODEL: gpt-image-1

      # ─── Internal (don't change unless you know what you're doing) ────────
      ARTPIPE_REPO: /repo
      SAM_URL: http://sam:8001
      REMBG_URL: http://rembg:7000
    depends_on:
      - sam
      - rembg

  sam:
    build:
      context: ./services/sam
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models
      - ./workspace:/workspace
      - ./mockups:/mockups
    environment:
      ARTPIPE_SAM_MODEL: facebook/sam-vit-base
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 30

  rembg:
    image: danielgatis/rembg:latest
    command: ["s", "--host", "0.0.0.0", "--port", "7000"]
    ports:
      - "7000:7000"

  review-ui:
    build:
      context: ./services/review-ui
      dockerfile: Dockerfile
    ports:
      - "8473:8473"
    volumes:
      - ./workspace:/app/workspace
      - ./game_assets:/app/game_assets
    environment:
      WORKSPACE: /app/workspace
      EXPORT_DIR: /app/game_assets
