services:
  artpipe-cli:
    build:
      context: ./asset_pipeline
      dockerfile: Dockerfile
    working_dir: /repo
    volumes:
      - ./:/repo
      - ./workspace:/repo/workspace
      - ./mockups:/repo/mockups
      - ./game_assets:/repo/game_assets
    environment:
      - ARTPIPE_REPO=/repo
      - ARTPIPE_VISION_PROVIDER=${ARTPIPE_VISION_PROVIDER:-gemini}
      - ARTPIPE_IMAGE_GEN_PROVIDER=${ARTPIPE_IMAGE_GEN_PROVIDER:-openai}
      - ARTPIPE_IMAGE_QUALITY=${ARTPIPE_IMAGE_QUALITY:-medium}
      - ARTPIPE_PROJECT_NAME=${ARTPIPE_PROJECT_NAME:-my-game}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SAM_URL=http://sam:8001
      - REMBG_URL=http://rembg:7000
    depends_on:
      - sam
      - rembg

  sam:
    build:
      context: ./services/sam
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models
      - ./workspace:/workspace
      - ./mockups:/mockups
    environment:
      - ARTPIPE_SAM_MODEL=${ARTPIPE_SAM_MODEL:-facebook/sam-vit-base}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 30

  rembg:
    image: danielgatis/rembg:latest
    command: ["s", "--host", "0.0.0.0", "--port", "7000"]
    ports:
      - "7000:7000"

  review-ui:
    build:
      context: ./services/review-ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./workspace:/app/workspace
      - ./game_assets:/app/game_assets
    environment:
      - WORKSPACE=/app/workspace
      - EXPORT_DIR=/app/game_assets
