<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}ArtPipe Review{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f242d;
      --border: #2a313d;
      --text: #e6e9ef;
      --muted: #8b93a2;
      --accent: #4dd2ff;
      --good: #57d68d;
      --bad: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    header .meta { color: var(--muted); font-size: 13px; }
    main { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: var(--accent); }
    .card h3 { margin: 0 0 4px 0; font-size: 14px; }
    .card .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.approved { background: rgba(87, 214, 141, 0.15); color: var(--good); }
    .badge.pending { background: rgba(139, 147, 162, 0.15); color: var(--muted); }
    .summary {
      display: flex;
      gap: 24px;
      padding: 14px 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 24px;
    }
    .summary .stat { display: flex; flex-direction: column; }
    .summary .stat b { font-size: 22px; }
    .summary .stat span { color: var(--muted); font-size: 12px; }
    .candidate-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 18px;
    }
    .candidate {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .candidate img {
      max-width: 100%;
      max-height: 320px;
      display: block;
      margin: 0 auto;
      background-image:
        linear-gradient(45deg, #2a313d 25%, transparent 25%),
        linear-gradient(-45deg, #2a313d 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2a313d 75%),
        linear-gradient(-45deg, transparent 75%, #2a313d 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      border-radius: 4px;
    }
    .candidate .label { font-size: 12px; color: var(--muted); margin: 8px 0; }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    button {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    button:hover { background: var(--border); }
    button.approve { color: var(--good); border-color: rgba(87, 214, 141, 0.4); }
    button.reject { color: var(--bad); border-color: rgba(255, 107, 107, 0.4); }
    .reference {
      background: var(--panel-2);
      border: 1px dashed var(--border);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
    }
    .reference h4 { margin: 0 0 8px 0; font-size: 13px; color: var(--muted); }
    form { display: contents; }
    .empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 8px;
    }
    code { background: var(--panel-2); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/" style="color: var(--text);">ArtPipe Review</a></h1>
    <span class="meta">{% block subtitle %}{% endblock %}</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
